name: Release

# Pushing a tag like v1.2.0 releases the version from gradle.properties. Before tagging, move the notes from
# "Unreleased" to a "1.2.0" section in CHANGELOG.md (./gradlew patchChangelog does it).
# A tag with a suffix, like v1.2.0-beta.1, goes out as a GitHub pre-release, a Modrinth beta and on the Hangar
# "Snapshot" channel.
#
# Repository secrets (Settings > Secrets and variables > Actions), each upload is skipped without its secret:
#   MODRINTH_TOKEN   - a Modrinth personal access token with the "Create versions" scope, uploads to
#                      https://modrinth.com/plugin/blockgens (project ID WZxrLw1e, set below)
#   HANGAR_API_TOKEN - a Hangar API key with the "create_version" permission, uploads to
#                      https://hangar.papermc.io/andret2344/BlockGens (set in build.gradle.kts)

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PRERELEASE: ${{ contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      - name: Check that the tag matches the project version
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in gradle.properties"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          {
            echo "MINECRAFT_VERSIONS<<EOF"
            grep '^minecraftVersions=' gradle.properties | cut -d= -f2 | tr ',' '\n'
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build and test
        run: ./gradlew build

      - name: Extract the release notes
        run: ./gradlew getChangelog --project-version="$VERSION" --no-header --no-links --output-file=build/release-notes.md

      - name: Release on GitHub
        uses: softprops/action-gh-release@v3
        with:
          name: BlockGens ${{ env.VERSION }}
          body_path: build/release-notes.md
          prerelease: ${{ env.PRERELEASE }}
          files: build/libs/BlockGens-${{ env.VERSION }}.jar

      # Secrets cannot be used in `if`, and putting the tokens into the job's env would show them to every action
      - name: Check for the tokens
        id: tokens
        run: |
          echo "modrinth=${{ secrets.MODRINTH_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
          echo "hangar=${{ secrets.HANGAR_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Release on Modrinth
        if: steps.tokens.outputs.modrinth == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: WZxrLw1e
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: BlockGens ${{ env.VERSION }}
          version: ${{ env.VERSION }}
          version-type: ${{ env.PRERELEASE == 'true' && 'beta' || 'release' }}
          changelog-file: build/release-notes.md
          files: build/libs/BlockGens-${{ env.VERSION }}.jar
          loaders: |
            paper
            purpur
          game-versions: ${{ env.MINECRAFT_VERSIONS }}

      - name: Release on Hangar
        if: steps.tokens.outputs.hangar == 'true'
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: >
          ./gradlew publishPluginPublicationToHangar
          -PhangarChannel="${{ env.PRERELEASE == 'true' && 'Snapshot' || 'Release' }}"
