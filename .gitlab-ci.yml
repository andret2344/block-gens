stages:
  - build

build:
  image: gradle:jdk12
  stage: build
  script:
    - gradle build --warning-mode all
  artifacts:
    paths:
      - build/libs/*.jar

badges:
  stage: build
  before_script:
    - chmod u+x ./gradlew
  script:
    - commits=`git rev-list --all --count`
    - latest_release_tag=$(git describe --tags `git rev-list --tags --max-count=1`)
    - spigot=`./gradlew getSpigotVersion`
    - echo $spigot
    - echo "{\"commits\":\"$commits\", \"release_tag"\:\"$latest_release_tag\"}" > badges.json
  artifacts:
    paths:
      - badges.json
    when: always
    expire_in: 4 weeks
