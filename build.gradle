plugins {
	id 'de.jansauer.printcoverage' version '2.0.0'
	id 'com.github.johnrengelman.shadow' version '7.1.2'
	id 'kr.entree.spigradle' version '2.4.2'
}

apply plugin: 'idea'
apply plugin: 'java'
apply plugin: 'jacoco'
apply plugin: 'maven-publish'

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

repositories {
	mavenCentral()
	mavenLocal()
	spigot()
	maven { url 'https://gitlab.com/api/v4/projects/12063927/packages/maven' }
}

dependencies {
	compileOnly group: 'org.spigotmc', name: 'spigot-api', version: "${spigotVersion}-R0.1-SNAPSHOT"
	compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.24'
	compileOnly group: 'org.jetbrains', name: 'annotations', version: '23.0.0'
	implementation group: 'eu.andret', name: 'ats-arguments', version: argumentsVersion
	implementation group: 'org.bstats', name: 'bstats-bukkit', version: '3.0.0'
	annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.24'

	testCompileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.24'
	testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.8.2'
	testImplementation group: 'org.spigotmc', name: 'spigot-api', version: "${spigotVersion}-R0.1-SNAPSHOT"
	testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.8.2'
	testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-params', version: '5.8.2'
	testImplementation group: 'org.mockito', name: 'mockito-core', version: '4.6.1'
	testImplementation group: 'org.mockito', name: 'mockito-inline', version: '4.6.1'
	testImplementation group: 'org.spigotmc', name: 'spigot-api', version: "${spigotVersion}-R0.1-SNAPSHOT"
	testAnnotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.24'
}

compileJava.options.compilerArgs << '-parameters' << '-g' << '-Xlint:deprecation' << '-Xlint:unchecked'
compileTestJava.options.compilerArgs << '-parameters' << '-g' << '-Xlint:deprecation' << '-Xlint:unchecked'

spigot {
	authors = ['Andret']
	apiVersion = '1.17'
	description = 'A plugin that allows to craft the blocks, that are generating other blocks.'
	version = project.version
	libraries = ['org.jetbrains:annotations:23.0.0']

	//noinspection GroovyAssignabilityCheck
	commands {
		blockgenerator {
			aliases = ['bg', 'generator']
		}
	}

	//noinspection GroovyAssignabilityCheck
	permissions {
		'ats.blockgenerator.*' {
			children = ['ats.blockgenerator.get': true]
		}
	}
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestCoverageVerification, printCoverage
}

jacocoTestReport {
	reports.xml.enabled true
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			limit {
				minimum = 0
			}
		}
	}
}

javadoc {
	source = sourceSets.main.allJava
	classpath = configurations.compileClasspath

	options {
		setMemberLevel JavadocMemberLevel.PUBLIC
		setAuthor true

		links 'https://docs.oracle.com/en/java/javase/17/docs/api/'
	}
}

task sourceJar(type: Jar) {
	archiveClassifier.set('sources')
	from sourceSets.main.allJava
}

task packageJavadoc(type: Jar) {
	archiveClassifier.set('javadoc')
	from javadoc
}

publishing {
	publications {
		//noinspection GroovyAssignabilityCheck
		library(MavenPublication) {
			from components.java
			artifact tasks.sourceJar
			artifact tasks.packageJavadoc
			groupId = project.group
			version = project.version
			artifactId = project.codeName
		}
	}
	repositories {
		maven {
			url 'https://gitlab.com/api/v4/projects/6382356/packages/maven'
			credentials(HttpHeaderCredentials) {
				name = 'Job-Token'
				value = System.getenv('CI_JOB_TOKEN')
			}
			authentication {
				//noinspection GroovyAssignabilityCheck
				header(HttpHeaderAuthentication)
			}
		}
	}
}

shadowJar {
	archiveFileName = "${project.name}-${project.version}.jar"
	relocate 'eu.andret.arguments', 'eu.andret.ats.blockgenerator.arguments'
	relocate 'org.bstats', 'eu.andret.ats.blockgenerator.bstats'
}

build.dependsOn(shadowJar)

tasks.register('spigotVersion') {
	doLast {
		println(spigotVersion)
	}
}

tasks.register('argumentsVersion') {
	doLast {
		println(argumentsVersion)
	}
}
