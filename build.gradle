import io.franzbecker.gradle.lombok.task.DelombokTask

buildscript {
	repositories {
		jcenter()
		maven { url 'https://plugins.gradle.org/m2/' }
	}
	dependencies { classpath 'io.franzbecker:gradle-lombok:2.0' }
}

plugins {
	id 'com.github.johnrengelman.shadow' version '5.2.0'
	id 'kr.entree.spigradle' version '1.2.1'
}

apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'io.franzbecker.gradle-lombok'

sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

repositories {
	mavenCentral()
	mavenLocal()
	spigot()
}

dependencies {
	compileOnly group: 'org.spigotmc', name: 'spigot-api', version: '1.15.2-R0.1-SNAPSHOT'
	compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.12'
	implementation group: 'org.jetbrains', name: 'annotations', version: '16.0.2'
	implementation group: 'org.json', name: 'json', version: '20190722'
	annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.12'
}

tasks.withType(JavaCompile) {
	options.compilerArgs << '-Xlint:unchecked' << '-parameters' << '-g'
	options.deprecation = true
}

spigot {
	authors = ['Andret']
	apiVersion = '1.15'
	description = 'A plugin that allows to craft the blocks, that are generating other blocks.'
}

shadowJar {
	setArchiveFileName "${project.name}-${project.version}.jar"
	relocate "org.json", "eu.andret.blockgenerator.json"
	project.configurations.implementation.canBeResolved = true
	configurations = [project.configurations.implementation]
}

build.dependsOn(shadowJar)

task delombok(type: DelombokTask, dependsOn: compileJava) {
	ext.outputDir = file("$buildDir/delombok")
	outputs.dir(outputDir)
	sourceSets.main.java.srcDirs.each {
		inputs.dir(it)
		args(it, '-d', outputDir)
	}
	doFirst { outputDir.deleteDir() }
}
