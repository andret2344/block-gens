# Names and lore use the MiniMessage format: https://docs.papermc.io/adventure/minimessage/format/

generators:
  sponge:
    # Ticks until the generated block comes back (20 ticks = 1 second)
    delay: 1
    blocks:
      generator: sponge
      generated: stone
    drops:
      bread:
        weight: 1
        count: 1
      apple:
        weight: 1
        count: 2
    # Optional - without it the generator can only be given with the command
    crafting:
      shape:
        - 'SSS'
        - 'SPS'
        - 'S S'
      mapping:
        'S': STONE
        'P': PISTON
    # Optional - prevent, drop or remove; defaults: generator drop, generated remove
    explosion:
      generator: drop
      generated: remove
  dirt:
    delay: 10
    blocks:
      generator: dirt
      generated: obsidian
    drops:
      obsidian:
        weight: 1
        count: 1
    crafting:
      shape:
        - 'S S'
        - 'SOS'
        - 'SSS'
      mapping:
        'S': STONE
        'O': OBSIDIAN

blocks:
  sponge:
    material: SPONGE
    name: '<dark_purple>Creates food!'
    lore:
      - 'I will give you'
      - '<dark_red>MANY</dark_red> foodstuffs!'
  dirt:
    material: DIRT
    name: '<dark_purple>Creates OBSIDIAN!'
    lore:
      - 'HIT ME!!'
  obsidian:
    material: OBSIDIAN
  stone:
    material: STONE
    name: 'Generated stone'
    lore:
      - 'Yay, I was generated!'

items:
  bread:
    material: BREAD
    name: 'Special bread'
    lore:
      - 'Some special bunch of flour'
  apple:
    material: APPLE
  obsidian:
    material: OBSIDIAN
