main: eu.andret.ats.blockgenerator.BlockGeneratorPlugin
name: atsBlockGenerator
version: 2.4.2
description: "A plugin that allows to craft blocks, that are generating other blocks."
authors:
  - Andret
api-version: 1.17
libraries:
  - org.jetbrains:annotations:23.0.0
commands:
  blockgenerator:
    aliases:
      - bg
      - generator
permissions:
  ats.blockgenerator.*:
    children:
      ats.blockgenerator.get: true
